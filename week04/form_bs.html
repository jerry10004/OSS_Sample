<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원 등록</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<div class="container mt-5">

    <h2>회원 등록</h2>
    <p>회원 정보를 입력하세요.</p>

    <!-- 회원 등록 Form -->
    <form id="userForm">

        <!-- 이름 -->
        <div class="mb-3">
            <label for="name" class="form-label">이름</label>
            <input type="text"
                   class="form-control"
                   id="name"
                   name="name"
                   placeholder="이름을 입력하세요"
                   required>
        </div>

        <!-- 이메일 -->
        <div class="mb-3">
            <label for="email" class="form-label">이메일</label>
            <input type="email"
                   class="form-control"
                   id="email"
                   name="email"
                   placeholder="example@email.com"
                   required>
        </div>

        <!-- 생년월일 -->
        <div class="mb-3">
            <label for="birth" class="form-label">생년월일</label>
            <input type="date"
                   class="form-control"
                   id="birth"
                   name="birth">
        </div>

        <!-- 전공 -->
        <div class="mb-3">
            <label for="major" class="form-label">전공</label>

            <select class="form-select"
                    id="major"
                    name="major">

                <option value="">전공을 선택하세요</option>
                <option value="Computer">컴퓨터공학</option>
                <option value="AI">인공지능</option>
                <option value="Electronic">전자공학</option>

            </select>
        </div>

        <!-- 관심 분야 -->
        <div class="mb-3">

            <label class="form-label">관심 분야</label>

            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       id="web"
                       value="Web">

                <label class="form-check-label" for="web">
                    Web
                </label>
            </div>

            <div class="form-check">
                <input class="form-check-input"
                       type="checkbox"
                       id="ai"
                       value="AI">

                <label class="form-check-label" for="ai">
                    AI
                </label>
            </div>

        </div>

        <!-- 자기소개 -->
        <div class="mb-3">

            <label for="intro" class="form-label">
                자기소개
            </label>

            <textarea class="form-control"
                      id="intro"
                      name="intro"
                      rows="3"
                      placeholder="간단한 자기소개를 입력하세요"></textarea>

        </div>

        <!-- 버튼 -->
        <button type="submit"
                class="btn btn-primary">
            등록
        </button>

        <button type="reset"
                class="btn btn-secondary">
            초기화
        </button>

    </form>


    <!-- 결과 출력 -->
    <div class="mt-5">

        <h3>등록 결과</h3>

        <div id="result"
             class="border rounded p-3">

            아직 등록된 정보가 없습니다.

        </div>
    </div>
</div>
<script>

    // form 찾기
    const form = document.querySelector("#userForm");

    // submit 이벤트 등록
    form.addEventListener("submit", function(event) {

        // 실제 서버 전송 막기
        event.preventDefault();

        // 입력값 가져오기
        const name = document.querySelector("#name").value;
        const email = document.querySelector("#email").value;
        const birth = document.querySelector("#birth").value;
        const major = document.querySelector("#major").value;
        const intro = document.querySelector("#intro").value;

        // 관심 분야
        let interests = [];

        if (document.querySelector("#web").checked) {
            interests.push("Web");
        }

        if (document.querySelector("#ai").checked) {
            interests.push("AI");
        }

        // 결과 출력
        document.querySelector("#result").innerHTML = `
            <p><strong>이름:</strong> ${name}</p>
            <p><strong>이메일:</strong> ${email}</p>
            <p><strong>생년월일:</strong> ${birth}</p>
            <p><strong>전공:</strong> ${major}</p>
            <p><strong>관심 분야:</strong> ${interests.join(", ")}</p>
            <p><strong>자기소개:</strong> ${intro}</p>
        `;

    });

</script>

</body>
</html>
